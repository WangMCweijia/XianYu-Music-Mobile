name: Analyze (fast)

on:
  workflow_dispatch:

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log | tail -80

      # 列表定位走「读实测布局」的实现，必须用真实渲染树验证落点，
      # 纯静态分析覆盖不到
      - name: Locate widget test
        run: flutter test test/list_locate_test.dart

      # 插件更新后的排序归位是纯函数（下标 + 剔除旧记录），本机无需设备即可
      # 覆盖，避免「更新一次沉底一次」这类回归
      - name: Plugin order test
        run: flutter test test/plugin_order_test.dart

      # 歌词附加轨是纯函数：译文对齐不能串行，罗马音按时间戳注入 `romaji` 字段
      # 而不是拼进主文（拼进主文会被解析器按脚本特征猜成译文，届时开关失效）
      - name: Lyric aux track test
        run: flutter test test/lyrics_translation_align_test.dart

      # 平台选择行左对齐：横向弹性滚动被推到负偏移时，整行会右移留出空白
      - name: Source bar align test
        run: flutter test test/source_bar_align_test.dart --reporter expanded

      # 自更新源：版本比较 / tag 归一 / Release 资产挑选都是纯函数，
      # 错了的后果是「有新版本不提示」或「提示了下载不到包」
      - name: Update source test
        run: flutter test test/update_source_test.dart --reporter expanded
