name: Analyze (fast)

on:
  workflow_dispatch:

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log | tail -80

      # 列表定位走「读实测布局」的实现，必须用真实渲染树验证落点，
      # 纯静态分析覆盖不到
      - name: Locate widget test
        run: flutter test test/list_locate_test.dart
