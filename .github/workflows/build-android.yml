name: Android Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-android:
    name: Flutter Android build (arm64 release APK)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47"
          channel: stable
          cache: true

      - name: Install Android SDK components
        run: |
          set -x
          # runner 自带 SDK（/usr/local/lib/android/sdk）但 sdkmanager 不在 PATH
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMGR=""
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$d" ] && SDKMGR="$d"
          done
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          # 新版 SDK 仓库按小版本拆分（37.0/37.1/37.2），无裸 android-37
          "$SDKMGR" "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2"
          # 锁定与 Flutter (AGP flutter.ndkVersion=r28c) 一致的 NDK，供 rust hook 使用；
          # 不用 runner 预装的最新 NDK，避免 cargo-ndk 与过新 NDK 不兼容
          "$SDKMGR" "ndk;28.2.13676358"
          NDKV="28.2.13676358"
          echo "Using NDK $NDKV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDKV" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDKV" >> "$GITHUB_ENV"

      - name: Write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/ks
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/ks/xianyu-release.jks
          {
            echo "storeFile=/tmp/ks/xianyu-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # frb 生成的 Dart 绑定已随仓库提交且与 rust 源同版本；
      # touch 让绑定成为最新文件，跳过 gradle-rust-hook 的 codegen 分支
      # （避免 checkout mtime 乱序触发 flutter_rust_bridge_codegen）。
      - name: Skip FRB codegen (bindings committed)
        run: touch lib/src/rust/frb_generated.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          # 关闭 VFS 文件监视，规避 CI 上 "Already watching path" 导致的 daemon 崩溃
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
        run: flutter build apk --release

      - name: Dump rust hook log (diagnostics)
        if: always()
        run: |
          if [ -f build/rust-hook.log ]; then
            echo '=== rust-hook.log tail ==='
            tail -60 build/rust-hook.log
          else
            echo 'no rust-hook.log'
          fi

      - name: Collect artifacts
        run: |
          set -x
          mkdir -p out
          shopt -s nullglob
          archived=(releases/android/*.apk)
          if [ ${#archived[@]} -gt 0 ]; then
            cp "${archived[0]}" out/
          else
            cp build/app/outputs/flutter-apk/app-release.apk out/
          fi
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cd out
          for f in *.apk; do
            mv "$f" "xianyu-music-mobile-v${VERSION}-arm64.apk"
          done
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-music-android
          path: out/*
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
